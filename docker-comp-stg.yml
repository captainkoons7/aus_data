## Docker Compose for a staging Postgres database
## Usage:
##   docker compose -f docker-comp-stg.yml up -d
##   docker compose -f docker-comp-stg.yml down
##   docker compose -f docker-comp-stg.yml logs -f postgres-stg

services:
  postgres-stg:
    image: postgres:16
    container_name: postgres-stg
    restart: unless-stopped
    environment:
      POSTGRES_DB: aus_staging       # change if you prefer
      POSTGRES_USER: aus_stg         # change if you prefer
      POSTGRES_PASSWORD: change_me   # change in real usage
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"  # host:container (5433 avoids clashing with local Postgres)
    volumes:
      - pgdata_stg:/var/lib/postgresql/data/pgdata   # persistent data volume
      - ./db/init:/docker-entrypoint-initdb.d:ro     # optional init scripts (*.sql, *.sh)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_stg:

