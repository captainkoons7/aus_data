## Docker Compose for a staging Postgres database
## Usage:
##   docker compose -f docker-compose.yml up -d
##   docker compose -f docker-compose.yml down
##   docker compose -f docker-compose.yml logs -f postgres-stg

name: pg-multi
services:
  postgres-stg:
    image: postgres:16
    container_name: pg-stg
    profiles: ["staging"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STG_DB}
      POSTGRES_USER: ${STG_USER}
      POSTGRES_PASSWORD: ${STG_PASS}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d  # initialization scripts
      - pgdata_stg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-prod:
    image: postgres:16
    container_name: pg-prod
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROD_DB}
      POSTGRES_USER: ${PROD_USER}
      POSTGRES_PASSWORD: ${PROD_PASS}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_stg:
  pgdata_prod:
